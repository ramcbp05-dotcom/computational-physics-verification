name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Run the verification suite
        run: python -m pytest tests/ -v

  error-report:
    name: error report is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Regenerate the numerical error report
        run: python scripts/error_report.py
      - name: Fail if any measured bound changed
        # The report is committed. A change here means an error bound moved,
        # which is exactly the thing that should be reviewed rather than
        # silently accepted. Only the timestamp line is allowed to differ.
        run: |
          if ! git diff --quiet -- results/numerical-error-report.md; then
            CHANGED=$(git diff --unified=0 -- results/numerical-error-report.md \
                      | grep -E '^[+-][^+-]' | grep -vc 'Generated by' || true)
            if [ "$CHANGED" -gt 0 ]; then
              echo "::error::measured error bounds changed:"
              git diff -- results/numerical-error-report.md
              exit 1
            fi
            echo "only the timestamp changed"
          fi

  figures:
    name: figures regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/make_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          retention-days: 14
