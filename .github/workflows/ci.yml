name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - name: Run the verification suite
        run: python -m pytest tests/ -v

  error-report:
    name: error report is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check the committed report against a fresh run
        # Not `git diff`. A quantity that is zero in exact arithmetic is
        # measured as round-off, and its value depends on the BLAS, the FMA
        # instructions and the CPU: the same correct code gives 2.205e-14 on
        # one machine and 1.795e-14 on another. A byte-exact diff fails on
        # every runner but the author's, and a check that always fails stops
        # being read. This compares structure exactly, which catches a stale
        # report, and numbers by magnitude. Rules are in the module docstring.
        run: python scripts/check_error_report.py

  figures:
    name: figures regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/make_figures.py
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          retention-days: 14
